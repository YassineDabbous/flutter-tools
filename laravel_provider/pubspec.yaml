name: laravel_provider
description: Laravel implementation for the logic skeleton using Dio and Retrofit.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  skeleton:
    path: ../skeleton
  core:
    path: ../core
  
  dio: ^5.9.0
  retrofit: ^4.9.0
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  retrofit_generator: ^10.1.2
  json_serializable: ^6.11.1
