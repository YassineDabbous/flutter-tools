name: laravel_provider
description: Laravel implementation for the logic skeleton using Dio and Retrofit.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  skeleton: ^0.0.1
  core: ^0.0.1
  
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
